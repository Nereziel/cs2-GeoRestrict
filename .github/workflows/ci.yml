name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GeoRestrict.sln

      - name: Build
        run: dotnet build GeoRestrict.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test GeoRestrict.Tests/GeoRestrict.Tests.csproj --configuration Release --no-build --no-restore
